services:
  typo-real:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MAX_UPLOAD_MB: "75"
      # Leave empty for the normal same-origin deployment.
      CORS_ORIGINS: ""
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - typo-real
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
