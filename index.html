<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Media Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --primary: #667eea;
            --bg-dark: #0f0f0f;
            --surface: rgba(255,255,255,0.08);
            --text: #ffffff;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Video Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.4s var(--transition);
        }

        /* Custom Controls Overlay */
        .controls-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.6) 100%);
            opacity: 1;
            transition: opacity 0.4s var(--transition);
            pointer-events: none;
            z-index: 10;
        }

        .controls-overlay.hidden {
            opacity: 0;
        }

        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            pointer-events: auto;
            transform: translateY(0);
            transition: transform 0.4s var(--transition);
        }

        .controls-overlay.hidden .controls-container {
            transform: translateY(100%);
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            transform: translateY(0);
            transition: transform 0.4s var(--transition);
        }

        .controls-overlay.hidden .top-bar {
            transform: translateY(-100%);
        }

        /* Buttons */
        .btn {
            background: var(--surface);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            font-size: 20px;
        }

        .btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }

        /* Settings Panel */
        .settings-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(20,20,20,0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px;
            min-width: 220px;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--transition);
            z-index: 20;
        }

        .settings-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .setting-item:hover { background: var(--surface); }
        .setting-label { font-size: 14px; opacity: 0.9; }
        .setting-value { font-size: 12px; opacity: 0.6; }

        /* Music Player Mode */
        .music-mode {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
        }

        .album-art {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .track-info h2 { font-size: 24px; margin-bottom: 8px; font-weight: 600; }
        .track-info p { font-size: 16px; opacity: 0.7; margin-bottom: 30px; }

        .music-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .music-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .music-btn.secondary {
            width: 48px;
            height: 48px;
            background: var(--surface);
            font-size: 18px;
        }

        .music-btn:active { transform: scale(0.9); }

        /* File Manager Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title { font-size: 18px; margin-bottom: 20px; font-weight: 600; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 6px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            outline: none;
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn.primary { background: var(--primary); color: white; }
        .modal-btn.secondary { background: var(--surface); color: white; }
        .modal-btn:active { opacity: 0.8; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30,30,30,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s var(--transition);
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Rotation Classes */
        .rotate-90 { transform: rotate(90deg); }
        .rotate-180 { transform: rotate(180deg); }
        .rotate-270 { transform: rotate(270deg); }

        /* Tab Switcher */
        .mode-switch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 4px;
            display: flex;
            z-index: 30;
        }

        .mode-tab {
            padding: 8px 20px;
            border-radius: 26px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Mode Switcher -->
    <div class="mode-switch">
        <button class="mode-tab active" onclick="switchMode('video')">ویدیو</button>
        <button class="mode-tab" onclick="switchMode('music')">موسیقی</button>
        <button class="mode-tab" onclick="openFileManager()">مدیریت فایل</button>
    </div>

    <!-- Video Player -->
    <div id="videoMode" class="video-wrapper">
        <video id="mainVideo" playsinline webkit-playsinline></video>
        
        <div class="controls-overlay" id="controlsOverlay">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="btn" onclick="toggleSettings()">⚙️</button>
                <button class="btn" onclick="toggleRotation()">🔄</button>
            </div>

            <!-- Bottom Controls -->
            <div class="controls-container">
                <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
                    <button class="btn" id="playPauseBtn" onclick="togglePlay()">▶️</button>
                    <div style="flex:1; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; position:relative; cursor:pointer;" 
                         onclick="seekVideo(event)">
                        <div id="progressBar" style="height:100%; background:var(--primary); border-radius:2px; width:0%; transition:width 0.1s;"></div>
                    </div>
                    <span id="timeDisplay" style="font-size:12px; opacity:0.8; min-width:80px; text-align:left;">00:00 / 00:00</span>
                </div>
                
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="btn" style="width:36px; height:36px; font-size:16px;" onclick="toggleMute()">🔊</button>
                    <input type="range" min="0" max="100" value="100" 
                           style="width:80px; accent-color:var(--primary);" 
                           oninput="setVolume(this.value)">
                    <button class="btn" style="width:36px; height:36px; font-size:16px;" onclick="toggleFullscreen()">⛶</button>
                </div>
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-item" onclick="setSpeed(0.5)">
                <span class="setting-label">سرعت پخش</span>
                <span class="setting-value" id="speedValue">1x</span>
            </div>
            <div class="setting-item" onclick="toggleLowPower()">
                <span class="setting-label">حالت کم‌مصرف</span>
                <span class="setting-value" id="lowPowerValue">خاموش</span>
            </div>
            <div class="setting-item" onclick="toggleAudioBoost()">
                <span class="setting-label">تقویت صدا</span>
                <span class="setting-value" id="audioBoostValue">خاموش</span>
            </div>
            <div class="setting-item" onclick="openFileManager()">
                <span class="setting-label">مدیریت فایل‌ها</span>
                <span class="setting-value">→</span>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div id="musicMode" class="music-mode">
        <img id="albumArt" class="album-art" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect fill='%23333' width='200' height='200'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23666' font-size='40'%3E🎵%3C/text%3E%3C/svg%3E" alt="Album Art">
        <div class="track-info">
            <h2 id="trackTitle">نام آهنگ</h2>
            <p id="trackArtist">نام خواننده</p>
        </div>
        <div class="music-controls">
            <button class="music-btn secondary" onclick="prevTrack()">⏮</button>
            <button class="music-btn" id="musicPlayBtn" onclick="toggleMusicPlay()">▶</button>
            <button class="music-btn secondary" onclick="nextTrack()">⏭</button>
        </div>
        <div style="margin-top:30px; width:100%; max-width:300px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; opacity:0.6; margin-bottom:8px;">
                <span id="musicCurrentTime">0:00</span>
                <span id="musicDuration">0:00</span>
            </div>
            <div style="height:4px; background:rgba(255,255,255,0.2); border-radius:2px; cursor:pointer;" onclick="seekMusic(event)">
                <div id="musicProgress" style="height:100%; background:var(--primary); border-radius:2px; width:0%;"></div>
            </div>
        </div>
    </div>

    <!-- File Manager Modal -->
    <div class="modal" id="fileModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">مدیریت فایل</div>
            
            <div id="renameSection" class="input-group" style="display:none;">
                <label>نام جدید</label>
                <input type="text" id="newFileName" placeholder="نام فایل را وارد کنید">
            </div>

            <div id="folderSection" class="input-group" style="display:none;">
                <label>نام پوشه</label>
                <input type="text" id="newFolderName" placeholder="نام پوشه را وارد کنید">
            </div>

            <div id="fileActions" style="display:none;">
                <div class="setting-item" onclick="showRenameInput()">
                    <span class="setting-label">✏️ تغییر نام</span>
                </div>
                <div class="setting-item" onclick="deleteCurrentFile()">
                    <span class="setting-label">🗑️ حذف از دستگاه</span>
                </div>
                <div class="setting-item" onclick="showCreateFolder()">
                    <span class="setting-label">📁 ساخت پوشه</span>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeModal()">لغو</button>
                <button class="modal-btn primary" id="confirmBtn" style="display:none;" onclick="confirmAction()">تأیید</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">پیام</div>

    <script>
        // ==================== CORE STATE ====================
        const state = {
            mode: 'video',
            rotation: 0,
            controlsVisible: true,
            hideTimer: null,
            settingsOpen: false,
            lowPower: false,
            audioBoost: false,
            currentFile: null,
            musicPlaying: false,
            pendingAction: null
        };

        const video = document.getElementById('mainVideo');
        const overlay = document.getElementById('controlsOverlay');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const toast = document.getElementById('toast');

        // ==================== NATIVE BRIDGE ====================
        const Native = {
            available: typeof AndroidMedia !== 'undefined',
            
            async getVideoUri(path) {
                if (this.available) return AndroidMedia.getVideoUri(path);
                console.warn('Native bridge not available, using fallback');
                return path;
            },

            async renameFile(oldPath, newName) {
                if (this.available) return AndroidMedia.renameFile(oldPath, newName);
                showToast('عملیات فقط در اپلیکیشن اندروید ممکن است');
                return false;
            },

            async deleteFile(path) {
                if (this.available) return AndroidMedia.deleteFile(path);
                showToast('عملیات فقط در اپلیکیشن اندروید ممکن است');
                return false;
            },

            async createFolder(parent, name) {
                if (this.available) return AndroidMedia.createFolder(parent, name);
                showToast('عملیات فقط در اپلیکیشن اندروید ممکن است');
                return false;
            },

            requestRotation() {
                if (this.available) AndroidMedia.requestRotation();
            }
        };

        // ==================== VIDEO PLAYER ====================
        function initVideoPlayer() {
            // Auto-hide controls
            resetHideTimer();
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.settings-panel') && !e.target.closest('.modal')) {
                    toggleControls();
                }
            });

            // Prevent default touch behaviors
            document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

            // Video events
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('ended', () => {
                playPauseBtn.textContent = '🔄';
                showControlsPermanently();
            });
            video.addEventListener('play', () => { playPauseBtn.textContent = '⏸'; resetHideTimer(); });
            video.addEventListener('pause', () => { playPauseBtn.textContent = '▶️'; showControlsPermanently(); });
        }

        function togglePlay() {
            if (video.paused) video.play();
            else video.pause();
        }

        function updateProgress() {
            if (video.duration) {
                const pct = (video.currentTime / video.duration) * 100;
                progressBar.style.width = pct + '%';
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        }

        function seekVideo(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            video.currentTime = pct * video.duration;
        }

        function toggleMute() {
            video.muted = !video.muted;
        }

        function setVolume(val) {
            video.volume = val / 100;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // ==================== CONTROLS VISIBILITY ====================
        function toggleControls() {
            state.controlsVisible = !state.controlsVisible;
            overlay.classList.toggle('hidden', !state.controlsVisible);
            if (state.controlsVisible) resetHideTimer();
        }

        function showControlsPermanently() {
            state.controlsVisible = true;
            overlay.classList.remove('hidden');
            clearTimeout(state.hideTimer);
        }

        function resetHideTimer() {
            clearTimeout(state.hideTimer);
            if (!video.paused && state.mode === 'video') {
                state.hideTimer = setTimeout(() => {
                    state.controlsVisible = false;
                    overlay.classList.add('hidden');
                    closeSettings();
                }, 5000);
            }
        }

        // ==================== ROTATION ====================
        function toggleRotation() {
            state.rotation = (state.rotation + 90) % 360;
            video.className = '';
            if (state.rotation > 0) video.classList.add(`rotate-${state.rotation}`);
            Native.requestRotation();
            resetHideTimer();
        }

        // ==================== SETTINGS ====================
        function toggleSettings() {
            state.settingsOpen = !state.settingsOpen;
            settingsPanel.classList.toggle('active', state.settingsOpen);
            if (state.settingsOpen) showControlsPermanently();
            else resetHideTimer();
        }

        function closeSettings() {
            state.settingsOpen = false;
            settingsPanel.classList.remove('active');
        }

        function setSpeed(speed) {
            video.playbackRate = speed;
            document.getElementById('speedValue').textContent = speed + 'x';
            showToast(`سرعت پخش: ${speed}x`);
        }

        function toggleLowPower() {
            state.lowPower = !state.lowPower;
            document.getElementById('lowPowerValue').textContent = state.lowPower ? 'روشن' : 'خاموش';
            if (state.lowPower) {
                video.poster = ''; // Disable poster to save power
                showToast('حالت کم‌مصرف فعال شد');
            } else {
                showToast('حالت کم‌مصرف غیرفعال شد');
            }
        }

        function toggleAudioBoost() {
            state.audioBoost = !state.audioBoost;
            document.getElementById('audioBoostValue').textContent = state.audioBoost ? 'روشن' : 'خاموش';
            // Audio boost would be handled natively
            showToast(state.audioBoost ? 'تقویت صدا فعال شد' : 'تقویت صدا غیرفعال شد');
        }

        // ==================== MUSIC PLAYER ====================
        let audio = new Audio();
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('musicProgress').style.width = pct + '%';
                document.getElementById('musicCurrentTime').textContent = formatTime(audio.currentTime);
                document.getElementById('musicDuration').textContent = formatTime(audio.duration);
            }
        });
        audio.addEventListener('ended', nextTrack);

        function toggleMusicPlay() {
            if (audio.paused) {
                audio.play();
                document.getElementById('musicPlayBtn').textContent = '⏸';
                state.musicPlaying = true;
            } else {
                audio.pause();
                document.getElementById('musicPlayBtn').textContent = '▶';
                state.musicPlaying = false;
            }
        }

        function prevTrack() { showToast('آهنگ قبلی'); }
        function nextTrack() { showToast('آهنگ بعدی'); }
        function seekMusic(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        // ==================== FILE MANAGER ====================
        function openFileManager() {
            document.getElementById('fileModal').classList.add('active');
            document.getElementById('fileActions').style.display = 'block';
            document.getElementById('renameSection').style.display = 'none';
            document.getElementById('folderSection').style.display = 'none';
            document.getElementById('confirmBtn').style.display = 'none';
            document.getElementById('modalTitle').textContent = 'مدیریت فایل';
            showControlsPermanently();
        }

        function closeModal() {
            document.getElementById('fileModal').classList.remove('active');
            resetHideTimer();
        }

        function showRenameInput() {
            document.getElementById('fileActions').style.display = 'none';
            document.getElementById('renameSection').style.display = 'block';
            document.getElementById('confirmBtn').style.display = 'block';
            document.getElementById('modalTitle').textContent = 'تغییر نام';
            state.pendingAction = 'rename';
        }

        function showCreateFolder() {
            document.getElementById('fileActions').style.display = 'none';
            document.getElementById('folderSection').style.display = 'block';
            document.getElementById('confirmBtn').style.display = 'block';
            document.getElementById('modalTitle').textContent = 'ساخت پوشه';
            state.pendingAction = 'createFolder';
        }

        async function confirmAction() {
            if (state.pendingAction === 'rename') {
                const newName = document.getElementById('newFileName').value.trim();
                if (newName && state.currentFile) {
                    const success = await Native.renameFile(state.currentFile, newName);
                    showToast(success ? 'نام فایل تغییر یافت ✓' : 'خطا در تغییر نام');
                }
            } else if (state.pendingAction === 'createFolder') {
                const folderName = document.getElementById('newFolderName').value.trim();
                if (folderName) {
                    const success = await Native.createFolder('/storage/emulated/0/Music', folderName);
                    showToast(success ? 'پوشه ساخته شد ✓' : 'خطا در ساخت پوشه');
                }
            }
            closeModal();
        }

        async function deleteCurrentFile() {
            if (state.currentFile) {
                const success = await Native.deleteFile(state.currentFile);
                showToast(success ? 'فایل حذف شد ✓' : 'خطا در حذف');
                closeModal();
            }
        }

        // ==================== UTILITIES ====================
        function switchMode(mode) {
            state.mode = mode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('videoMode').style.display = mode === 'video' ? 'flex' : 'none';
            document.getElementById('musicMode').style.display = mode === 'music' ? 'flex' : 'none';

            if (mode === 'video') {
                audio.pause();
                state.musicPlaying = false;
                resetHideTimer();
            } else {
                video.pause();
                showControlsPermanently();
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==================== INITIALIZATION ====================
        window.addEventListener('DOMContentLoaded', () => {
            initVideoPlayer();
            
            // Load sample file for testing
            // In real app, this comes from Native bridge
            // video.src = await Native.getVideoUri('/path/to/video.mp4');
            
            showToast('پخش‌کننده آماده است');
        });

        // Handle back button in Android
        window.addEventListener('popstate', () => {
            if (state.settingsOpen) closeSettings();
            else if (document.getElementById('fileModal').classList.contains('active')) closeModal();
            else if (state.mode === 'music') switchMode('video');
        });
    </script>
</body>
</html>
